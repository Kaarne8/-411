
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rekisteröitymislomake</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="maat.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container mt-5 mb-5">
        <div class="lomake mx-auto">

            <h1>Rekisteröitymislomake</h1>
            <p>Siirry kentästä toiseen tab-näppäimellä.</p>
            <form id="omaLomake" novalidate>
            <div class="mb-3">
                <label for="kayttajaId" class="form-label">Käyttäjä ID *</label>
                <input type="text" class="form-control" id="kayttajaId">
                <div class="invalid-feedback" id="kayttajaIdVirhe"></div>
            </div>
                <div class="mb-3">
                    <label for="salasana" class="form-label">Salasana *</label>
                    <input type="password" class="form-control" id="salasana">
                    <div class="invalid-feedback" id="salasanaVirhe"></div>
                </div>
                
                <div class="mb-3">
                    <label for="nimi" class="form-label">Nimi *</label>
                    <input type="text" class="form-control" id="nimi">
                    <div class="invalid-feedback" id="nimiVirhe"></div>
                </div>

                <div class="mb-3">
                    <label for="osoite" class="form-label">Osoite *</label>
                    <input type="text" class="form-control" id="osoite">
                    <div class="invalid-feedback" id="osoiteVirhe"></div>
                </div>

                <div class="mb-3">
                    <label for="maa" class="form-label">Maa *</label>
                    <select class="form-select" id="maa" name="maa">
                        <option value="">Valitse maa</option>
                    </select>
                    <div class="invalid-feedback" id="maaVirhe"></div>
                </div>

                <div class="mb-3">
                    <label for="postinumero" class="form-label">Postinumero *</label>
                    <input type="text" class="form-control" id="postinumero" inputmode="numeric">
                    <div class="invalid-feedback" id="postinumeroVirhe"></div>
                </div>
                <div class="mb-3">
                    <label for="sahkoposti" class="form-label">Sähköposti *</label>
                    <input type="text" class="form-control" id="sahkoposti">
                    <div class="invalid-feedback" id="sahkopostiVirhe"></div>
                </div>

                <fieldset class="mb-3">
                    <legend class="form-label fs-6">Sukupuoli *</legend>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sukupuoli" id="nainen" value="Nainen">
                        <label class="form-check-label" for="nainen">Nainen</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sukupuoli" id="mies" value="Mies">
                        <label class="form-check-label" for="mies">Mies</label>
                    </div>

                    <div class="text-danger small" id="sukupuoliVirhe"></div>
                </fieldset>

                <fieldset class="mb-3">
                    <legend class="form-label fs-6">Kieli *</legend>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="kieli" id="suomi" value="Suomi">
                        <label class="form-check-label" for="suomi">Suomi</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="kieli" id="muuKieli" value="Muu kuin suomi">
                        <label class="form-check-label" for="muuKieli">Muu kuin suomi</label>
                    </div>

                    <div class="text-danger small" id="kieliVirhe"></div>
                </fieldset>
                <div class="mb-3">
                    <label for="lisatiedot" class="form-label">Lisätietoja</label>
                    <textarea class="form-control" id="lisatiedot" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Lähetä</button>

                <div id="lomakeTulos" class="mt-3" role="status" aria-live="polite"></div>
            </form>

            <p class="small mt-3">* Pakollinen kenttä</p>
        </div>
    </div>
</body>
</html>
